<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="dark"><title>SuperMonoAgent Mobile</title>
<link rel="stylesheet" href="vendor/xterm.css"><link rel="stylesheet" href="app.css"></head>
<body><header><button id="sessions" aria-label="切换终端">☰</button><div class="heading"><strong id="title">终端</strong><small id="status">正在连接</small></div><button id="debug" aria-haspopup="dialog" aria-controls="debug-dialog">调试</button><button id="control" aria-pressed="false" disabled>接管</button><button id="options" aria-label="终端设置">⋯</button></header>
<div id="notice" role="status" hidden></div><main id="screen" aria-label="远端终端"></main>
<div id="resume" hidden><span>正在查看历史</span><button id="bottom">回到底部 ↓</button></div>
<dialog id="composer" aria-labelledby="composer-heading"><div class="dialog-heading"><div><h2 id="composer-heading">编辑指令</h2><p id="composer-target" class="hint"></p></div><button id="composer-close">关闭</button></div><textarea id="draft" rows="5" aria-label="输入指令" placeholder="输入指令；Enter 发送，Shift+Enter 换行" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><p id="composer-status" class="hint" role="status">收到终端回显后自动按一次回车。</p><div class="form-actions"><button id="send">发送</button></div></dialog>
<div id="terminal-status" role="status" aria-label="Codex status" hidden></div>
<nav id="terminal-actions" aria-label="历史翻页与终端操作"><button id="page-up" aria-label="向上翻一页历史">上翻</button><button id="page-down" aria-label="向下翻一页历史">下翻</button><button id="history-top" aria-label="跳到历史顶部">顶部</button><button id="history-bottom" aria-label="跳到最新输出">底部</button><button data-key="enter" aria-label="发送回车">回车</button><button id="refresh-screen" aria-label="从服务器刷新当前画面">刷新</button></nav>
<nav id="keys" aria-label="终端辅助键"><button data-key="escape">Esc</button><button data-key="tab">Tab</button><button id="ctrl" aria-pressed="false">Ctrl</button><button data-key="f2">F2</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="left">←</button><button data-key="right">→</button><button id="mode" aria-haspopup="dialog" aria-expanded="false">编辑</button><button id="github" aria-haspopup="dialog">提交 GitHub</button></nav>
<dialog id="debug-dialog" aria-labelledby="debug-heading">
<div class="dialog-heading"><div><h2 id="debug-heading">中继终端总览</h2><p class="hint">只读监测当前页；点击方块打开终端</p></div><button id="debug-close" aria-label="关闭调试总览">关闭</button></div>
<div class="debug-toolbar"><label for="debug-density">排列 <select id="debug-density"><option value="9">九宫格</option><option value="16" selected>十六宫格</option></select></label><span id="debug-count" class="hint" role="status"></span></div>
<div id="debug-board"><div id="debug-grid" data-density="16" aria-label="中继终端方块列表"></div><p id="debug-empty" class="empty-state" hidden>暂无中继终端，请检查连接或返回连接设置测试。</p></div>
<div class="debug-pagination"><button id="debug-prev" aria-label="上一页终端">上一页</button><span id="debug-page" class="hint"></span><button id="debug-next" aria-label="下一页终端">下一页</button></div>
</dialog>
<dialog id="session-dialog" aria-labelledby="workspace-heading">
<div class="dialog-heading"><div><h2 id="workspace-heading">工作空间</h2><p id="host-identity" class="hint">选择电脑和终端</p></div><button id="sessions-close" aria-label="关闭工作空间">关闭</button></div>
<section aria-labelledby="computers-heading"><div class="section-heading"><h3 id="computers-heading">电脑</h3><button id="host-add">＋ 添加电脑</button></div><div id="host-list"></div></section>
<section aria-labelledby="windows-heading"><div class="section-heading"><h3 id="windows-heading">窗口 / 终端</h3><span id="session-count" class="hint"></span></div><label class="search-label" for="session-search">搜索当前电脑的终端</label><input id="session-search" type="search" placeholder="搜索窗口、智能体或路径" autocomplete="off"><div id="session-list"></div></section>
<div class="new"><select id="shell" aria-label="新终端类型"><option value="powershell">PowerShell</option><option value="pwsh">PowerShell 7</option><option value="cmd">CMD</option><option value="claude">Claude</option><option value="codex">Codex</option></select><button id="new">＋ 新建终端</button></div></dialog>
<dialog id="host-dialog" aria-labelledby="host-heading"><h2 id="host-heading">添加电脑</h2><p class="hint">中继连接可在连接设置中测试并选择同一 Token 的全部授权房间。下方为高级手动电脑配置，令牌仅在本次页面会话保留。</p><button id="host-discover" type="button">测试并选择房间（连接设置）</button><form id="host-form"><label for="host-name">电脑名称<input id="host-name" required maxlength="60" placeholder="例如：办公室电脑"></label><label for="host-endpoint">中继 IP / 地址<input id="host-endpoint" type="text" inputmode="url" required placeholder="117.50.48.22 或完整 URL" autocomplete="off" autocapitalize="off" spellcheck="false"></label><label for="host-port">端口（默认 443）<input id="host-port" type="number" min="1" max="65535" value="443" inputmode="numeric"></label><label for="host-code">手动房间（高级，可留空）<input id="host-code" maxlength="128" autocomplete="off" autocapitalize="off" spellcheck="false"></label><label for="host-token">访问令牌<input id="host-token" type="password" autocomplete="off"></label><p id="host-error" role="alert" hidden></p><div class="form-actions"><button id="host-cancel" type="button">取消</button><button type="submit">保存并连接</button></div></form></dialog>
<dialog id="settings-dialog"><h2>终端设置</h2><p id="ui-revision" class="hint"></p><label for="agent-mode">智能体模式<select id="agent-mode" aria-label="智能体模式"><option value="auto">自动</option><option value="codex">Codex</option><option value="claude-code">Claude Code</option><option value="grok">Grok</option><option value="kimi">Kimi</option><option value="pi-dev">pi.dev</option><option value="cursor-cli">Cursor CLI</option></select></label><p id="agent-mode-status" class="hint" role="status">先选择终端</p><label>文本高亮 <input id="highlight" type="checkbox" checked></label><label>终端尺寸 <select id="sizing"><option value="phone">清晰字号（可左右滑动）</option><option value="shared">全屏总览（缩小显示）</option></select></label><label>显示字号 <input id="font" type="range" min="11" max="22" step="1" value="14"></label><label>渲染方式 <select id="renderer"><option value="auto">自动</option><option value="dom">DOM</option><option value="webgl">WebGL</option></select></label><p id="render-status"></p><button id="copy">复制选中/可见文本</button><a href="/notifications">任务完成通知</a><a href="/reload">重新连接</a><a href="/settings">连接设置</a><button id="settings-close">关闭</button></dialog>
<dialog id="copy-dialog"><h2>长按文本复制</h2><textarea id="copy-text" readonly rows="8"></textarea><button id="copy-close">关闭</button></dialog>
<script src="vendor/xterm.js"></script><script src="vendor/xterm-fit.js"></script><script src="vendor/xterm-unicode11.js"></script><script src="vendor/xterm-webgl.js"></script><script src="vendor/terminal-client.js"></script><script src="mobile-core.js"></script><script src="app.js"></script></body></html>
