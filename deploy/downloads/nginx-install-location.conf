# Insert inside the existing HTTPS server, never the plaintext bootstrap server.
location ^~ /install/ {
    access_log off;
    proxy_pass http://127.0.0.1:18818;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
}
