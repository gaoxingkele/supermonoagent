# Add as a separate virtual host; retain existing domain/SNI sites.
server {
    listen 80;
    server_name 117.50.48.22;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/supermono-acme;
        default_type text/plain;
    }
    location / { return 308 https://117.50.48.22$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 117.50.48.22;
    ssl_certificate /etc/letsencrypt-supermono/live/supermono-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-supermono/live/supermono-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"role":"relay"}';
    }
    location ^~ /updates/ {
        if ($uri ~ "(^|/)[.]") { return 404; }
        alias /var/lib/supermono-updates/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
    }
    location /GEO/ {
        proxy_pass http://127.0.0.1:8871/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        # The existing relay process owns no PTYs. Its room state is retained.
        proxy_pass http://127.0.0.1:6770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
