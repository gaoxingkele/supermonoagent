# Existing port 81 and domain virtual hosts are intentionally unaffected.
server {
    listen 80;
    server_name 117.50.48.22;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/supermono-acme;
        default_type text/plain;
    }
    location / { return 308 https://117.50.48.22$request_uri; }
}
