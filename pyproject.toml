[project]
name = "supermonoagent"
version = "0.1.0"
description = "Windows host for PowerShell and coding-agent CLIs, with a phone client and a splicing relay."
requires-python = ">=3.11"
dependencies = [
  "pywinpty>=2.0.14; sys_platform == 'win32'",
  "websockets>=13",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]

[project.scripts]
supermono = "supermonoagent.daemon:main"
supermono-relay = "supermonoagent.relay:main"
supermono-client = "supermonoagent.launcher:main"

[tool.setuptools.package-data]
supermonoagent = ["static/*.js", "static/*.css", "static/*.json", "static/agent-modes/*.json", "static/*.ico", "static/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
