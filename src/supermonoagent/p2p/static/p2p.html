<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点对点传输</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#dfe3e8;--text:#1d2329;--muted:#66717c;--accent:#2563eb;--accent-text:#fff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--hover:#eef3ff;--sel:#dbe7ff;--bar:#e8ecf1}
@media (prefers-color-scheme:dark){:root{--bg:#15181c;--panel:#1d2126;--line:#30363d;--text:#e6e9ec;--muted:#98a2ad;--accent:#4f8cff;--accent-text:#fff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--hover:#252b33;--sel:#233552;--bar:#2a3038}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}.dot.wait{background:var(--warn)}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button:disabled{opacity:.5;cursor:default}
main{display:grid;grid-template-columns:1fr 220px 1fr;gap:12px;padding:12px 16px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
section h2{font-size:13px;margin:0;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.crumb{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.crumb .path{flex:1;font-family:"Cascadia Mono",Consolas,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.list{height:46vh;overflow:auto}
.row{display:flex;align-items:center;gap:8px;padding:5px 10px;cursor:pointer;border-bottom:1px solid transparent}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .ico{width:18px;text-align:center}
.row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--muted);font-size:12px;white-space:nowrap}
.empty{padding:16px;color:var(--muted)}
.peer{display:flex;flex-direction:column;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.peer:hover{background:var(--hover)}.peer.sel{background:var(--sel)}
.peer small{color:var(--muted)}
.sendbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 16px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.sendbar .what{flex:1;min-width:220px;overflow-wrap:anywhere;color:var(--muted)}
.sendbar .what b{color:var(--text);font-weight:600}
#transfers{margin:12px 16px 24px}
.tr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr .title{overflow-wrap:anywhere}
.tr .sub{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.tr .acts{display:flex;gap:6px;align-items:start;grid-row:1/3;grid-column:2}
.bar{height:6px;background:var(--bar);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.st-done{color:var(--ok)}.st-failed{color:var(--bad)}.st-waiting,.st-paused{color:var(--warn)}
.route{display:inline-block;padding:0 6px;border-radius:4px;background:var(--bar);font-size:12px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);max-width:min(560px,calc(100vw - 32px));width:100%}
dialog label{display:block;margin:10px 0 4px;color:var(--muted)}
dialog input,dialog textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
dialog textarea{font-family:"Cascadia Mono",Consolas,monospace;font-size:12px;height:60px}
.hint{color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:6px;max-width:calc(100vw - 32px);display:none}
@media (max-width:860px){main{grid-template-columns:1fr}.list{height:36vh}}
</style>
</head>
<body>
<header>
  <h1>点对点传输</h1>
  <span class="pill"><span id="rv-dot" class="dot"></span><span id="rv-text">信令未连接</span></span>
  <span class="pill" id="me-text"></span>
  <span class="spacer"></span>
  <button id="settings-btn" type="button">设置</button>
</header>
<main>
  <section>
    <h2>本机 <span id="local-name"></span></h2>
    <div class="crumb"><button id="local-up" type="button" title="上一级">↑</button><span class="path" id="local-path">此电脑</span></div>
    <div class="list" id="local-list"></div>
  </section>
  <section>
    <h2>目标电脑</h2>
    <div id="peers" class="list" style="height:auto;max-height:46vh"></div>
  </section>
  <section>
    <h2>对方目录 <span id="remote-name"></span></h2>
    <div class="crumb"><button id="remote-up" type="button" title="上一级">↑</button><span class="path" id="remote-path">先选目标电脑</span><button id="remote-mkdir" type="button" disabled>新建文件夹</button></div>
    <div class="list" id="remote-list"><div class="empty">在中间选一台电脑</div></div>
  </section>
</main>
<div class="sendbar">
  <div class="what" id="send-what">在左边点一个文件夹或文件作为要发送的内容；在右边进入目标文件夹。</div>
  <button class="primary" id="send-btn" type="button" disabled>发送</button>
</div>
<section id="transfers"><h2>传输</h2><div id="transfer-list"><div class="empty">还没有传输</div></div></section>
<dialog id="settings">
  <form method="dialog">
    <h3 style="margin:0 0 6px">设置</h3>
    <label for="set-name">本机显示名</label>
    <input id="set-name" maxlength="64">
    <label>本网络加入码（发给自己的其他电脑；持有它就能读写允许的目录）</label>
    <textarea id="set-code" readonly></textarea>
    <button type="button" id="show-code">显示加入码</button> <button type="button" id="copy-code">复制</button>
    <label for="set-join">加入另一个网络（粘贴另一台电脑的加入码）</label>
    <textarea id="set-join" placeholder="smap2p1:..."></textarea>
    <p class="hint" id="set-info"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button type="button" id="set-join-btn">加入</button>
      <button type="button" id="set-save">保存名称</button>
      <button value="close">关闭</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let token='';
try{const h=new URLSearchParams(location.hash.slice(1));if(h.get('t')){token=h.get('t');sessionStorage.setItem('sma-p2p-token',token);history.replaceState(null,'',location.pathname);}else token=sessionStorage.getItem('sma-p2p-token')||'';}catch{}
const state={snap:null,local:{path:'',parent:null,entries:[]},src:null,peer:null,remote:{path:'',parent:null,entries:[]}};
function toast(text){const t=$('toast');t.textContent=text;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',4000);}
async function api(path,body={}){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-SMA-Token':token},body:JSON.stringify(body)});const v=await r.json().catch(()=>({error:'响应无效'}));if(!r.ok)throw Error(v.error||('HTTP '+r.status));return v;}
const fmt=n=>{if(!n)return '0 B';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++;}return (i?n.toFixed(n<10?2:1):n)+' '+u[i];};
const routeName={lan:'局域网',ipv6:'IPv6',public:'公网直连',punch:'打洞',relay:'中转'};
const statusName={scanning:'扫描中',connecting:'连接中',sending:'发送中',finishing:'收尾',waiting:'等待对方',paused:'已暂停',failed:'失败',done:'完成',receiving:'接收中',cancelled:'已取消'};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function renderList(box,data,{onOpen,onPick,picked}){
  box.replaceChildren();
  if(!data.entries.length){box.append(el('div','empty','空文件夹'));return;}
  for(const e of data.entries){
    const row=el('div','row'+(picked&&picked===e.path?' sel':''));
    row.append(el('span','ico',e.dir?'📁':'📄'),el('span','name',e.name),el('span','meta',e.dir?'':fmt(e.size)));
    row.title=e.path;
    row.onclick=()=>{if(onPick)onPick(e);};
    row.ondblclick=()=>{if(e.dir&&onOpen)onOpen(e.path);};
    box.append(row);
  }
}
async function openLocal(path){try{state.local=await api('local/list',{path});$('local-path').textContent=state.local.path||'此电脑';drawLocal();}catch(e){toast(e.message);}}
function drawLocal(){renderList($('local-list'),state.local,{onOpen:openLocal,picked:state.src?.path,onPick:e=>{if(!state.local.path){openLocal(e.path);return;}state.src=e;drawLocal();updateSend();}});}
async function openRemote(path){if(!state.peer)return;$('remote-path').textContent='读取中…';try{state.remote=await api('peer/list',{peer:state.peer,path});$('remote-path').textContent=state.remote.path||'对方的盘';$('remote-mkdir').disabled=!state.remote.path;drawRemote();updateSend();}catch(e){$('remote-path').textContent='读取失败';toast(e.message);}}
function drawRemote(){renderList($('remote-list'),state.remote,{onOpen:openRemote,onPick:e=>{if(e.dir)openRemote(e.path);}});}
function updateSend(){
  const peer=state.snap?.peers.find(p=>p.peer===state.peer);
  const ok=state.src&&peer&&state.remote.path;
  $('send-btn').disabled=!ok;
  if(state.src||peer){
    const w=$('send-what');w.replaceChildren();
    w.append('发送 ',el('b','',state.src?state.src.path:'（左边选一个）'),' → ',el('b','',peer?peer.name:'（选目标电脑）'),' ：',el('b','',state.remote.path||'（进入目标文件夹）'));
  }
}
$('local-up').onclick=()=>openLocal(state.local.parent||'');
$('remote-up').onclick=()=>openRemote(state.remote.parent||'');
$('remote-mkdir').onclick=async()=>{const name=prompt('新文件夹名称');if(!name)return;try{const r=await api('peer/mkdir',{peer:state.peer,path:state.remote.path,name});await openRemote(r.path);}catch(e){toast(e.message);}};
$('send-btn').onclick=async()=>{try{await api('send',{src:state.src.path,peer:state.peer,dest:state.remote.path});toast('已开始发送');}catch(e){toast(e.message);}};
function drawPeers(){
  const box=$('peers');box.replaceChildren();const peers=state.snap?.peers||[];
  if(!peers.length){box.append(el('div','empty',state.snap?.me.rv_state==='online'?'同一网络里没有其他在线电脑。到另一台电脑的「设置」里粘贴本机的加入码。':'信令服务未连接'));return;}
  for(const p of peers){
    const row=el('div','peer'+(p.peer===state.peer?' sel':''));
    row.append(el('span','',p.name),el('small','',p.ip+(p.connected?' · 已连接 '+(routeName[p.route]||p.route):'')));
    row.onclick=()=>{if(state.peer!==p.peer){state.peer=p.peer;state.remote={path:'',parent:null,entries:[]};$('remote-name').textContent=p.name;drawPeers();openRemote('');}};
    box.append(row);
  }
  if(state.peer&&!peers.some(p=>p.peer===state.peer)){$('remote-path').textContent='对方已离线';}
}
function drawTransfers(){
  const box=$('transfer-list');box.replaceChildren();const items=state.snap?.transfers||[];
  if(!items.length){box.append(el('div','empty','还没有传输'));return;}
  for(const t of items){
    const row=el('div','tr'),pct=t.bytes_total?Math.min(100,t.bytes_done/t.bytes_total*100):(t.status==='done'?100:0);
    const title=el('div','title');title.append((t.direction==='out'?'↑ ':'↓ ')+t.name+(t.direction==='out'?' → '+(t.peer_name||t.peer):' ← '+(t.peer_name||t.peer))+'  ');
    const st=el('span','st-'+t.status,statusName[t.status]||t.status);title.append(st);
    if(t.route){title.append(' ',el('span','route',routeName[t.route]||t.route));}
    const bar=el('div','bar');const fill=document.createElement('i');fill.style.width=pct.toFixed(1)+'%';bar.append(fill);
    const sub=el('div','sub',fmt(t.bytes_done)+' / '+fmt(t.bytes_total)+' · '+t.files+' 个文件'+(t.skipped_files?' · 跳过已有 '+t.skipped_files:'')+(t.speed?' · '+fmt(t.speed)+'/s':'')+' · '+(t.direction==='out'?t.dest:t.base)+(t.error?' · '+t.error:''));
    const acts=el('div','acts');
    const add=(label,action)=>{const b=el('button','',label);b.type='button';b.onclick=async()=>{try{await api('transfer',{tid:t.tid,action});}catch(e){toast(e.message);}};acts.append(b);};
    if(t.direction==='out'){
      if(['sending','connecting','scanning','finishing'].includes(t.status))add('暂停','pause');
      if(['paused','failed','waiting'].includes(t.status))add('续传','resume');
      if(t.status!=='done')add('取消','cancel');
      if(['done','failed','paused'].includes(t.status))add('移除','remove');
    }else if(['done','cancelled','paused'].includes(t.status))add('移除','remove');
    row.append(title,acts,bar,sub);box.append(row);
  }
}
function drawHeader(){
  const me=state.snap.me;
  $('rv-dot').className='dot'+(me.rv_state==='online'?' on':me.rv_state==='connecting'?' wait':'');
  $('rv-text').textContent=me.rv_state==='online'?'信令已连接 '+me.rendezvous:me.rv_state==='connecting'?'正在连接信令':'信令未连接'+(me.rv_error?'：'+me.rv_error:'');
  $('me-text').textContent=me.name+' · 网络 '+me.net+(me.public_ip?' · 公网 '+me.public_ip:'')+' · 端口 '+me.port;
  $('local-name').textContent=me.name;
}
function apply(snap){state.snap=snap;drawHeader();drawPeers();drawTransfers();updateSend();}
function connect(){
  const es=new EventSource('/api/events?t='+encodeURIComponent(token));
  es.onmessage=ev=>{try{apply(JSON.parse(ev.data));}catch{}};
  es.onerror=()=>{$('rv-text').textContent='本机服务已断开，重连中…';$('rv-dot').className='dot';};
}
$('settings-btn').onclick=()=>{$('set-name').value=state.snap?.me.name||'';$('set-code').value='';$('set-info').textContent='电脑号 '+(state.snap?.me.peer||'')+'，版本 '+(state.snap?.me.version||'')+'，允许的根目录：'+(state.snap?.me.roots||[]).join('、');$('settings').showModal();};
$('show-code').onclick=async()=>{try{$('set-code').value=(await api('join-code')).code;}catch(e){toast(e.message);}};
$('copy-code').onclick=async()=>{try{if(!$('set-code').value)$('set-code').value=(await api('join-code')).code;await navigator.clipboard.writeText($('set-code').value);toast('已复制');}catch(e){toast(e.message);}};
$('set-save').onclick=async()=>{try{await api('rename',{name:$('set-name').value});toast('已保存');}catch(e){toast(e.message);}};
$('set-join-btn').onclick=async()=>{if(!confirm('加入后本机离开当前网络，只能看到新网络里的电脑。继续？'))return;try{await api('join',{code:$('set-join').value});$('set-join').value='';toast('已加入');state.peer=null;}catch(e){toast(e.message);}};
if(!token){document.body.prepend(el('p','empty','缺少本机令牌：请用程序启动时打印的地址打开本页。'));}
openLocal('');connect();
})();
</script>
</body>
</html>
